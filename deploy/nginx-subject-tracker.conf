# /etc/nginx/sites-available/subject-tracker  (symlink into sites-enabled)
# Replace SERVER_NAME with your domain (or the VM's public IP for HTTP-only).
# After `certbot --nginx` runs, it rewrites this to add the HTTPS (443) block
# and an HTTP→HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Allow JSON backup uploads (the app caps at 8 MB; nginx default is 1 MB).
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
