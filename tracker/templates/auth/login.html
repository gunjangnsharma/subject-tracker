{% extends "base.html" %}
{% block title %}Log in &middot; Subject Tracker{% endblock %}

{% block content %}
<div class="auth-wrap reveal">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to track your subjects and study plan.</p>
    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
      <label>Username
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Log in</button>
    </form>
    <p class="muted auth-alt">
      No account? <a href="{{ url_for('auth.register') }}">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
