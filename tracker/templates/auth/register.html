{% extends "base.html" %}
{% block title %}Sign up &middot; Subject Tracker{% endblock %}

{% block content %}
<div class="auth-wrap reveal">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="muted">Your subjects and progress are private to you.</p>
    <form method="post" action="{{ url_for('auth.register') }}" class="auth-form">
      <label>Username
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password <span class="muted">(min 6 characters)</span>
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <button type="submit">Sign up</button>
    </form>
    <p class="muted auth-alt">
      Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
